name: bench
on:
  push:
  workflow_dispatch:
jobs:
  boot:
    strategy:
      fail-fast: false
      matrix:
        variant: [stock, turn, slim]
        run: [1, 2]
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go install github.com/mobai-app/simslim/cmd/simslim@7e374b3
      - run: brew install xcodegen
      - working-directory: probe
        run: |
          xcodegen
          xcodebuild -project Probe.xcodeproj -scheme Probe -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGN_IDENTITY=- build -quiet
      - run: RESULTS=result.json PROBE=probe/build/Build/Products/Debug-iphonesimulator/Probe.app ./bench ${{ matrix.variant }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.variant }}-${{ matrix.run }}
          path: |
            result.json
            keyboard-*.png
